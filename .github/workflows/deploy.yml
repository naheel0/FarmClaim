name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-farmclaim
  REGISTRY: ghcr.io
  BACKEND_API_URL: https://backend.ashywater-78ecbb49.southeastasia.azurecontainerapps.io

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: >-
      contains(join(github.event.head_commit.modified, ' '), 'FarmClaim/') ||
      contains(join(github.event.head_commit.added, ' '), 'FarmClaim/') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./FarmClaim
          file: ./FarmClaim/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/naheel0/farmclaim-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/naheel0/farmclaim-backend:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        run: |
          az containerapp update \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n backend \
            --image ${{ env.REGISTRY }}/naheel0/farmclaim-backend:${{ github.sha }} \
            --set-env-vars \
              "Email__SendGridApiKey=${{ secrets.ELASTIC_EMAIL_API_KEY }}" \
              "Email__FromEmail=${{ secrets.EMAIL_FROM }}" \
              "Email__FromName=FarmClaim" \
              "Email__DummyMode=false"

      - name: Health check
        run: |
          sleep 30
          curl -f https://backend.ashywater-78ecbb49.southeastasia.azurecontainerapps.io/api/v1/health || exit 1

  deploy-frontend:
    runs-on: ubuntu-latest
    if: >-
      contains(join(github.event.head_commit.modified, ' '), 'farmclaim-frontend/') ||
      contains(join(github.event.head_commit.added, ' '), 'farmclaim-frontend/') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./farmclaim-frontend
          file: ./farmclaim-frontend/Dockerfile
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.BACKEND_API_URL }}
            NEXT_PUBLIC_API_URL=${{ env.BACKEND_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/naheel0/farmclaim-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/naheel0/farmclaim-frontend:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n frontend \
            --image ${{ env.REGISTRY }}/naheel0/farmclaim-frontend:${{ github.sha }}
