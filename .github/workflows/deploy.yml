name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-farmclaim
  ACR_NAME: acrfarmclaim
  ACR_URI: acrfarmclaim.azurecr.io
  BACKEND_IMAGE_NAME: backend
  FRONTEND_IMAGE_NAME: frontend
  BACKEND_CONTAINER_APP: backend
  FRONTEND_CONTAINER_APP: frontend
  BACKEND_API_URL: https://backend.ashywater-78ecbb49.southeastasia.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push backend Docker image
        run: |
          docker build \
            -t ${{ env.ACR_URI }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_URI }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
            -f FarmClaim/Dockerfile \
            ./FarmClaim
          docker push ${{ env.ACR_URI }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_URI }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build and push frontend Docker image
        run: |
          docker build \
            -t ${{ env.ACR_URI }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_URI }}/${{ env.FRONTEND_IMAGE_NAME }}:latest \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ env.BACKEND_API_URL }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_API_URL }} \
            -f farmclaim-frontend/Dockerfile \
            ./farmclaim-frontend
          docker push ${{ env.ACR_URI }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_URI }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Deploy backend to Azure Container Apps
        run: |
          az containerapp update \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ${{ env.BACKEND_CONTAINER_APP }} \
            --image ${{ env.ACR_URI }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy frontend to Azure Container Apps
        run: |
          az containerapp update \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ${{ env.FRONTEND_CONTAINER_APP }} \
            --image ${{ env.ACR_URI }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
